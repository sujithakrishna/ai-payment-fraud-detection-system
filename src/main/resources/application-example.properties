spring.application.name=ai-payment-fraud-detection
server.port=8080
server.error.include-stacktrace=never

spring.datasource.url=jdbc:mysql://localhost:3306/payment_fraud_detection
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.devtools.restart.enabled=true

# JWT configuration - provide a secure secret through an environment variable
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

logging.level.org.springframework.security=DEBUG
logging.level.com.sujitha.aipaymentfrauddetection.security=DEBUG
